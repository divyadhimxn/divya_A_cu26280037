{% extends 'base.html' %}{% block content %}<section class="panel"><h1>{{ action }} Medicine</h1><form method="post">
<label>Medicine ID</label><input name="medicine_id" type="number" required>
<label>Medicine Name</label><input name="name" required><label>Category</label><input name="category" required>
<label>Price (₹)</label><input name="price" type="number" min="0" step="0.01" required>
<label>Stock</label><input name="stock" type="number" min="0" required>
<label>Manufacturer</label><input name="manufacturer" required><button>{{ action }} Medicine</button></form></section>{% endblock %}
