{% extends 'base.html' %}{% block content %}<section class="panel"><h1>{{ action }} Student</h1>
<form method="post">
<label>Student ID</label><input name="student_id" type="number" required value="{{ student.student_id if student else '' }}" {% if student %}readonly{% endif %}>
<label>Student Name</label><input name="name" required value="{{ student.name if student else '' }}">
<label>Age</label><input name="age" type="number" min="1" required value="{{ student.age if student else '' }}">
<label>Gender</label><select name="gender" required><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select>
<label>Department</label><input name="department" required value="{{ student.department if student else '' }}">
<label>Marks</label><input name="marks" type="number" min="0" max="100" step="0.01" required value="{{ student.marks if student else '' }}">
<button>{{ action }} Student</button></form></section>{% endblock %}
