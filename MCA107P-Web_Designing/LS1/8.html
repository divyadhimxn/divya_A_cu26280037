    <h1>Computer Science Glossary</h1>

    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language used to create webpages.</dd>

        <dt>CPU</dt>
        <dd>Central Processing Unit that executes instructions.</dd>

        <dt>RAM</dt>
        <dd>Random Access Memory used for temporary data storage.</dd>

        <dt>Algorithm</dt>
        <dd>A step-by-step procedure for solving a problem.</dd>

        <dt>Database</dt>
        <dd>An organized collection of data.</dd>
    </dl>
