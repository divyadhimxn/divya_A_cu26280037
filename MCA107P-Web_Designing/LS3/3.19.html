<!DOCTYPE html>
<html>
<body>

<h2>Keyboard Event Detector</h2>
<input id="key" placeholder="Press any key">
<p id="result"></p>

<script>
let input = document.getElementById("key");
let result = document.getElementById("result");

input.addEventListener("keydown", e => {
    result.innerHTML = "Key: " + e.key +
        "<br>Code: " + e.code;
});

input.addEventListener("keyup", () => {
    result.innerHTML += "<br>Key Released";
});
</script>

</body>
</html>
