<!DOCTYPE html>
<html>
<body>

<h2>Fibonacci Series</h2>
<input id="n" type="number" placeholder="Enter terms">
<button onclick="generate()">Generate</button>
<div id="result"></div>

<script>
function generate() {
    let n = Number(document.getElementById("n").value);
    let a = 0, b = 1, s = "";

    for (let i = 1; i <= n; i++) {
        s += a + " ";
        let c = a + b;
        a = b;
        b = c;
    }

    document.getElementById("result").innerHTML = s;
}
</script>

</body>
</html>
